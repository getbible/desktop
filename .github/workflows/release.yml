name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string
      snap_channel:
        description: Snap Store channel
        required: true
        default: stable
        type: choice
        options: [edge, beta, candidate, stable]
      publish_snap:
        description: Publish the Snap after the GitHub Release is created
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  WEBAPP_CONFIG_JSON: ${{ secrets.WEBAPP_CONFIG_JSON }}
  WEBAPP_ICON_BASE64: ${{ secrets.WEBAPP_ICON_BASE64 }}
  WEBAPP_NAME: ${{ vars.WEBAPP_NAME }}
  WEBAPP_SLUG: ${{ vars.WEBAPP_SLUG }}
  WEBAPP_ID: ${{ vars.WEBAPP_ID }}
  WEBAPP_URL: ${{ vars.WEBAPP_URL }}
  WEBAPP_HOMEPAGE_URL: ${{ vars.WEBAPP_HOMEPAGE_URL }}
  WEBAPP_SUMMARY: ${{ vars.WEBAPP_SUMMARY }}
  WEBAPP_DESCRIPTION: ${{ vars.WEBAPP_DESCRIPTION }}
  WEBAPP_ABOUT: ${{ vars.WEBAPP_ABOUT }}
  WEBAPP_ALLOWED_ORIGINS: ${{ vars.WEBAPP_ALLOWED_ORIGINS }}
  WEBAPP_SHOW_APP_MENU: ${{ vars.WEBAPP_SHOW_APP_MENU }}
  WEBAPP_SUPPORT_URL: ${{ vars.WEBAPP_SUPPORT_URL }}
  WEBAPP_SUPPORT_EMAIL: ${{ vars.WEBAPP_SUPPORT_EMAIL }}
  WEBAPP_SUPPORT_MESSAGE: ${{ vars.WEBAPP_SUPPORT_MESSAGE }}
  WEBAPP_OFFLINE_TITLE: ${{ vars.WEBAPP_OFFLINE_TITLE }}
  WEBAPP_OFFLINE_MESSAGE: ${{ vars.WEBAPP_OFFLINE_MESSAGE }}
  WEBAPP_SNAP_NAME: ${{ vars.WEBAPP_SNAP_NAME }}
  WEBAPP_WINDOWS_IDENTITY_NAME: ${{ vars.WEBAPP_WINDOWS_IDENTITY_NAME }}
  WEBAPP_WINDOWS_PUBLISHER: ${{ vars.WEBAPP_WINDOWS_PUBLISHER }}
  WEBAPP_WINDOWS_PUBLISHER_DISPLAY_NAME: ${{ vars.WEBAPP_WINDOWS_PUBLISHER_DISPLAY_NAME }}
  WEBAPP_WINDOWS_ARCHITECTURE: ${{ vars.WEBAPP_WINDOWS_ARCHITECTURE }}
  WEBAPP_MACOS_MINIMUM_SYSTEM_VERSION: ${{ vars.WEBAPP_MACOS_MINIMUM_SYSTEM_VERSION }}
  WEBAPP_MACOS_CATEGORY: ${{ vars.WEBAPP_MACOS_CATEGORY }}
  WEBAPP_MACOS_COPYRIGHT: ${{ vars.WEBAPP_MACOS_COPYRIGHT }}

concurrency:
  group: release-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish_snap: ${{ steps.release.outputs.publish_snap }}
    steps:
      - id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version='${{ inputs.version }}'
            tag="v${version#v}"
            channel='${{ inputs.snap_channel }}'
            publish_snap='${{ inputs.publish_snap }}'
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            publish_snap='true'
            case "${version}" in
              *-alpha*|*-dev*) channel='edge' ;;
              *-beta*) channel='beta' ;;
              *-rc*) channel='candidate' ;;
              *) channel='stable' ;;
            esac
          fi
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version: ${version}" >&2; exit 1; }
          prerelease='false'; [[ "${version}" == *-* ]] && prerelease='true'
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "channel=${channel}"
            echo "prerelease=${prerelease}"
            echo "publish_snap=${publish_snap}"
          } >> "$GITHUB_OUTPUT"

  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      WEBAPP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
          python -m pip install --requirement tools/requirements.txt
      - run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/linux/*.tar.gz
          if-no-files-found: error

  snap:
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      WEBAPP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement tools/requirements.txt
      - run: python tools/configure_app.py --config config/app.json --output generated
      - id: snapcraft
        uses: snapcore/action-build@v1
      - uses: actions/upload-artifact@v4
        with:
          name: snap-release
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-2022
    env:
      WEBAPP_VERSION: ${{ needs.prepare.outputs.version }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement tools/requirements.txt
      - name: Decode optional Windows certificate
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64)) {
            $path = Join-Path $env:RUNNER_TEMP 'desktop-signing.pfx'
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
            "WINDOWS_PFX_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
      - shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/windows/*.msix
          if-no-files-found: error

  macos:
    needs: prepare
    runs-on: macos-14
    env:
      WEBAPP_VERSION: ${{ needs.prepare.outputs.version }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement tools/requirements.txt
      - name: Import optional Apple certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${APPLE_CERTIFICATE_BASE64}" ]]; then
            CERT="$RUNNER_TEMP/signing.p12"; KEYCHAIN="$RUNNER_TEMP/build.keychain-db"; PASSWORD="$(openssl rand -hex 24)"
            printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$CERT"
            security create-keychain -p "$PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
            security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            security set-key-partition-list -S apple-tool:,apple: -k "$PASSWORD" "$KEYCHAIN"
            security list-keychain -d user -s "$KEYCHAIN"
          fi
      - name: Build DMG
        env:
          APPLE_NOTARIZE: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' && secrets.APPLE_ID != '' && '1' || '0' }}
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/macos/*.dmg
          if-no-files-found: error

  github-release:
    needs: [prepare, linux, snap, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          generate_release_notes: true
          files: release-assets/*

  publish-snap:
    needs: [prepare, github-release]
    if: ${{ always() && needs.github-release.result == 'success' && needs.prepare.outputs.publish_snap == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snap-release
          path: snap-release
      - name: Require Snap Store credentials
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          [[ -n "${SNAPCRAFT_STORE_CREDENTIALS}" ]] || { echo 'SNAPCRAFT_STORE_CREDENTIALS is not configured.' >&2; exit 1; }
      - name: Publish Snap
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: snap-release/*.snap
          release: ${{ needs.prepare.outputs.channel }}
